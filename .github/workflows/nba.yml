name: NBA articles

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
    inputs:
      status:
        description: "publish or draft"
        default: publish
      max_posts:
        description: "max articles this run"
        default: "10"
      only_leagues:
        description: "test runs only: e.g. lba,acb,lnb (empty = all)"
        default: ""
      max_age_hours:
        description: "news older than this is skipped (empty = 30)"
        default: ""
      max_judge:
        description: "items judged per feed (empty = each feed's own)"
        default: ""

concurrency:
  group: nba-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow "opencv-python-headless<5"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Write & publish
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_STATUS: ${{ inputs.status || 'publish' }}
          MAX_POSTS: ${{ inputs.max_posts || '10' }}
          ONLY_LEAGUES: ${{ inputs.only_leagues || '' }}
          NEWS_MAX_AGE_HOURS: ${{ inputs.max_age_hours || '' }}
          MAX_JUDGE: ${{ inputs.max_judge || '' }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          git config user.name "nba-bot"
          git config user.email "nba-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
