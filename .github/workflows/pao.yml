name: Παναθηναϊκός (trifillakia) + δελτία τύπου

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      status:
        description: "publish or draft"
        default: publish
      max_posts:
        description: "max articles this run"
        default: "4"
      press_age_hours:
        description: "press releases: how many hours back"
        default: "24"

concurrency:
  group: pao-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow "opencv-python-headless<5"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Rewrite & publish
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_STATUS: ${{ inputs.status || 'publish' }}
          MAX_POSTS: ${{ inputs.max_posts || '4' }}
        run: python pao.py
      # press releases of info@totalbasket.gr (press.py) ride on this job: no extra runner minutes
      - name: Press releases (info@totalbasket.gr)
        if: always()
        continue-on-error: true
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          PRESS_SENDER_ADDRS: ${{ secrets.PRESS_SENDER_ADDRS }}
          WP_STATUS: ${{ inputs.status || 'publish' }}
          MAX_POSTS: "8"
          MAX_AGE_HOURS: ${{ inputs.press_age_hours || '24' }}
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq catdoc poppler-utils) >/dev/null 2>&1 || true
          python press.py
      - name: Save state
        if: always()
        run: |
          git config user.name "pao-bot"
          git config user.email "pao-bot@users.noreply.github.com"
          git add pao_state.json press_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "pao state" && git pull --rebase -q && git push)
