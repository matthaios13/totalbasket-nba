name: Παναθηναϊκός (trifillakia)

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      status:
        description: "publish or draft"
        default: publish
      max_posts:
        description: "max articles this run"
        default: "4"

concurrency:
  group: pao-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow opencv-python-headless
      - run: npm install -g @anthropic-ai/claude-code
      - name: Rewrite & publish
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WP_STATUS: ${{ inputs.status || 'publish' }}
          MAX_POSTS: ${{ inputs.max_posts || '4' }}
        run: python pao.py
      - name: Save state
        if: always()
        run: |
          git config user.name "pao-bot"
          git config user.email "pao-bot@users.noreply.github.com"
          git add pao_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "pao state" && git pull --rebase -q && git push)
